<section class="page-header"><h1>Contact Us</h1><p>Cornubia Shelter, Durban North - Open Mon-Sat 8am-5pm</p></section>
<section class="content">
    <form id="enquiryForm">
        <!-- Form with validation - required fields for Part 2 -->
        <h2>Send Enquiry</h2>
        <label>Full Name</label>
        <input type="text" placeholder="Zethembiso Nduli" required>
        <label>Email Address</label>
        <input type="email" placeholder="ndulizeth@email.com" required>
        <label>Interest</label>
        <select required>
            <option value="">-- Select --</option>
            <option>Adopt an Animal</option>
            <option>Volunteer</option>
            <option>Donate</option>
            <option>Report Abuse</option>
        </select>
        <label>Message</label>
        <textarea rows="5" placeholder="How can we help?" required></textarea>
        <button type="submit">Send Message</button>
        <p style="margin-top:15px; font-size:14px;">📞 031 123 4567 | 📍 12 Cornubia Dr, Durban North</p>
    </form>
